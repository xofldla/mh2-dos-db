# guide/ 폴더를 그대로 GitHub Pages 로 배포한다 (빌드는 로컬에서 하고 결과만 올림)
name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["guide/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guide
      - id: deployment
        uses: actions/deploy-pages@v4
